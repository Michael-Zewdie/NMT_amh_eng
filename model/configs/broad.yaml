# am-en-broad — BROAD arm of the DOMAIN-BREADTH experiment.
#
# HYPOTHESIS:
#   narrow training domain -> HIGHER in-distribution BLEU, WORSE OOD
#   broad  training domain -> LOWER  in-distribution BLEU, BETTER OOD
#
# Two arms, identical in every respect except the domain breadth of the training
# text. Built by experiments/domain_breadth.py.
#
#   narrow  bible-uedin (OPUS)  41,832 train  one book, one register
#   broad   NLLB mined bitext   41,850 train  ~1,300 effective web domains
#
# CORRECTED 2026-08-06: this comment previously said 47,756/47,761 train — the
# counts from a first attempt (runs/breadth.log, swapped in ~18:33) that got
# superseded ~25 min later by the rerun actually reflected in runs/overnight.log
# (started ~18:58) and in the checkpoints' mtimes. 47,756/47,761 never trained
# anything; the numbers above are what runs/am-en-narrow, runs/am-en-broad
# actually trained on. Full provenance (exact AfriCOMET/LID cutoffs, per-source
# survivor counts) is now captured structurally — see
# data/final_narrow/manifest.json / data/final_broad/manifest.json and
# processing.utils.manifest — instead of only in these prose comments, which is
# what let this drift in the first place.
#
# Pinned across both arms: corpus size (matched to within 5 pairs), tokenizers
# (NOT retrained -> vocabulary fixed), architecture, LR, warmup (so peak LR is
# identical at 6.99e-4), dropout, seed, step count, cleaning kernel, and the
# 80/10/10 length-stratified am-grouped split.
#
# max_steps 29000 = ~29 epochs over ~41.8k pairs at 48/step, matching the epoch
# count of am-en-base-v6 and am-en-gezmu-only so training length is not a variable.
#
# Each arm is scored on ITS OWN validation split (that is what "in-distribution"
# means) and on the SAME fixed FLORES/MAFAND files.
#
# Known asymmetry, stated not hidden: both arms DID get the same numeric
# AfriCOMET (>0.5) and LID (>0.90) cutoffs — see experiments/domain_breadth.py's
# shared-threshold search. What's NOT symmetric is LASER: nllb rows were already
# laser_score>1.06-filtered at collection time (collection/collect.py
# LASER_CUTOFF); bible-uedin was never mined, so it never goes through a LASER
# step at all. Both are high quality by construction but not filtered
# identically. This varies domain breadth, not provenance quality.
#
# Reads data/prepared_broad/ — swapped into place as data/prepared/am-en.
run_name: am-en-broad

model:
  d_model: 512
  n_heads: 8
  n_encoder_layers: 6
  n_decoder_layers: 6
  d_ff: 2048
  dropout: 0.1
  max_len: 150
  tie_output_projection: true

data:
  src_lang: am
  tgt_lang: en
  # Explicit since the historical incident this project already hit once: this
  # arm's data was originally read by physically swapping data/prepared_broad/
  # into place as data/prepared/am-en/, which silently breaks the moment
  # something else occupies that slot (see model/data/dataset.py's docstring).
  prepared_dir: data/prepared_broad
  max_src_len: 150
  max_tgt_len: 150
  batch_size: 48
  num_workers: 8

training:
  warmup_steps: 4000        # same as v6 -> identical peak LR 6.99e-4
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  accum_steps: 1
  max_steps: 29000          # ~29.35 epochs, matching v6's epoch count
  amp_dtype: bf16
  seed: 42
  save_every_steps: 1000
  eval_every_steps: 1000
  eval_subset_size: 3000    # same as v6, so the subset scores are comparable
  log_every_steps: 200
  resume_from: null

inference:
  beam_size: 4
  max_len: 150
  length_penalty: 0.6
