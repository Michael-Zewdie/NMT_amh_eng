# en-am-base-v1 — REVERSE direction, trained to enable backtranslation.
#
# Backtranslation for the am->en system needs monolingual ENGLISH translated INTO
# Amharic, so the decoder always sees real target text. That requires this model.
# Gezmu et al. measured +1.1 BLEU from exactly this on this language pair
# (Table 4: NMT 26.7 -> NMT+CACO 27.8).
#
# Raw material is already on disk: the pipeline discards ~15.8M NLLB pairs whose
# PAIRINGS were bad but whose individual sentences are fine monolingual text.
#
# Identical recipe to am-en-base-v6 (the Gezmu replication) with src/tgt swapped.
# Reads data/prepared/en-am/ — a different directory from the am-en cache, keyed
# off cfg.data.{src_lang,tgt_lang}, so NO data swapping is needed and the forward
# direction is untouched. Built by experiments/prepare_reverse.py.
#
# CAVEAT on its scores: model.evaluate.corpus_scores uses sacrebleu's default 13a
# tokenizer, which is correct for an English target and WRONG for an Amharic one
# (sacrebleu has no Amharic-aware tokenizer; tokenize="none" would be the honest
# choice). Training is unaffected, but this run's val_bleu is not comparable to
# any am->en number and should not be quoted. It is a means to backtranslation,
# not a system to report.
run_name: en-am-base-v1

model:
  d_model: 512
  n_heads: 8
  n_encoder_layers: 6
  n_decoder_layers: 6
  d_ff: 2048
  dropout: 0.1              # paper: "dropout rate of 0.1"
  max_len: 150              # >= prepare.py MAX_LEN; positional table size, not a paper value
  tie_output_projection: true

data:
  src_lang: en
  tgt_lang: am
  max_src_len: 150
  max_tgt_len: 150
  batch_size: 48            # ≈1024 target tokens — see deviation 1
  num_workers: 8

training:
  warmup_steps: 4000        # inferred from Vaswani et al. (2017); also sets peak LR 6.99e-4
  label_smoothing: 0.1      # paper: "label smoothing of value 0.1"
  grad_clip_norm: 1.0
  accum_steps: 1            # batch_size IS the batch
  max_steps: 250000         # paper: "250000 steps"
  amp_dtype: bf16
  seed: 42
  # Cadence scaled for a 250k-step run: one 3000-example greedy eval costs ~60-230s
  # depending on how often the model emits EOS, so every-500 would make the run
  # mostly eval.
  save_every_steps: 5000
  eval_every_steps: 5000
  # 3000, not v4's 500: v4 selected best.pt via 157 repeated comparisons against the
  # same 500 examples and overstated true quality by ~3.3 BLEU (subset 29.69 vs full
  # validation 26.39).
  eval_subset_size: 3000
  log_every_steps: 500
  # 110k, still improving). Restores model + optimizer + scheduler + step.
  resume_from: null

inference:
  # Paper: "Following Wu et al. (2016), we used a beam size of four and a length
  # penalty of 0.6." Live — see model/search.py. length_penalty is Wu et al.
  # eq. 14's alpha: lp(Y) = ((5 + |Y|) / 6) ** alpha.
  beam_size: 4
  max_len: 150
  length_penalty: 0.6
