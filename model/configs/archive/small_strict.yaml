# See EXPERIMENTS.md ("small-architecture track") — name implies a stricter data cutoff was
# in effect at training time (not pinned down precisely — data/final/ changed multiple times
# that day). Worst OOD result of any model trained: FLORES 5.46/28.31, MAFAND 3.02/22.23.
# Independently corroborates the rejected-0.85-cutoff lesson: over-filtering hurts.
run_name: am-en-small-strict

model:
  d_model: 256
  n_heads: 4
  n_encoder_layers: 4
  n_decoder_layers: 4
  d_ff: 1024
  dropout: 0.3
  max_len: 150
  tie_output_projection: true

data:
  src_lang: am
  tgt_lang: en
  # Predates the 8k retrain (checkpoint embeddings are 32000 x 256) — without these
  # keys the checkpoint fails (or worse, silently mismatches) against today's 8k
  # default. See base_v4.yaml's identical comment for the incident that surfaced this.
  src_tokenizer: data/tokenizer/am_32k_v4
  tgt_tokenizer: data/tokenizer/en_32k_v4
  max_src_len: 128
  max_tgt_len: 128
  batch_size: 128
  num_workers: 8

training:
  warmup_steps: 1500
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  accum_steps: 1
  max_steps: 80000
  amp_dtype: bf16
  seed: 42
  save_every_steps: 800
  eval_every_steps: 800
  eval_subset_size: 500
  log_every_steps: 50
  resume_from: null

inference:
  beam_size: 1
  max_len: 150
  length_penalty: 1.0
