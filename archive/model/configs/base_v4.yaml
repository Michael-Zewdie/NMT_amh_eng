# See EXPERIMENTS.md — BEST MODEL SO FAR. Tiered cutoffs (curated sources gezmu/afridoc/
# quran unfiltered, mined nllb/ccaligned kept strict) after root-causing against Gezmu et
# al. LREC 2022. Configured for 224k steps, manually stopped at 180k (plateaued ~step 86k).
# Use checkpoints/best.pt (step 157000), not last.pt — best.pt tracks the periodic-eval
# peak; full validation BLEU 26.39, FLORES 14.97/41.00 chrF++, MAFAND 6.30/28.44 chrF++.
run_name: am-en-base-v4

model:
  d_model: 512
  n_heads: 8
  n_encoder_layers: 6
  n_decoder_layers: 6
  d_ff: 2048
  dropout: 0.1
  max_len: 150
  tie_output_projection: true

data:
  src_lang: am
  tgt_lang: en
  # v4 predates the 8k retrain — its embeddings are 32000 x 512, so it only loads
  # against the tokenizers it was trained on. Without these keys the checkpoint
  # fails with a size mismatch against today's default 8k vocabulary.
  src_tokenizer: data/tokenizer/am_32k_v4
  tgt_tokenizer: data/tokenizer/en_32k_v4
  # Own prepared cache (50,720 validation pairs, tokenized with the 32k vocab
  # above) — was named data/prepared/am-en_32k_v4/ which doesn't fit the
  # {prepared_dir}/{src}-{tgt} convention model/data/dataset.py expects, so it's
  # now data/prepared_v4_32k/am-en/. Without this override, evaluating v4 would
  # silently load today's default data/prepared/am-en — different pool AND
  # 8k-tokenized ids fed to a 32k-vocab embedding table. No crash, just wrong.
  prepared_dir: data/prepared_v4_32k
  max_src_len: 128
  max_tgt_len: 128
  batch_size: 128
  num_workers: 8

training:
  warmup_steps: 4000
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  accum_steps: 1
  max_steps: 224000
  amp_dtype: bf16
  seed: 42
  save_every_steps: 1000
  eval_every_steps: 1000
  eval_subset_size: 500
  log_every_steps: 50
  resume_from: null

inference:
  beam_size: 1
  max_len: 150
  length_penalty: 1.0
